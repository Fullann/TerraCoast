name: Build & Deploy Vite to SFTP

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (with env)
        run: npm run build
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      # Copie le .htaccess manuellement dans dist car les fichiers dot
      # peuvent être exclus par upload-artifact
      - name: Ensure .htaccess is in dist
        run: |
          cp public/.htaccess dist/.htaccess
          echo "Contenu du dist:"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # IMPORTANT: include-hidden-files permet d'inclure .htaccess
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify .htaccess presence
        run: |
          echo "Fichiers dans dist:"
          ls -la dist/
          if [ -f dist/.htaccess ]; then
            echo "✅ .htaccess trouvé"
            cat dist/.htaccess
          else
            echo "❌ .htaccess MANQUANT!"
            exit 1
          fi

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          protocol: ftps
          local-dir: dist/
          server-dir: /
          dangerous-clean-slate: true
          # Exclure uniquement les fichiers git, PAS .htaccess
          exclude: |
            **/.git*
            **/.git*/**
            **/.ftp-deploy-sync-state.json
